name: kalan_app
description: Cahier intelligent de l'élève africain
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_gemma: ^0.10.2
  camera: ^0.10.5+9
  cupertino_icons: ^1.0.2
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.5.0
  connectivity_plus: ^7.1.1
  google_mlkit_text_recognition: ^0.15.1
  tesseract_ocr: ^0.5.0
  image_picker: ^1.0.7
  share_plus: ^7.2.2
  app_links: ^7.0.0
  flutter_tts: ^3.8.5
  vibration: ^3.1.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  uuid: ^4.3.3
  flutter_blue_plus: ^1.31.5
  permission_handler: ^11.3.1
  file_picker: ^11.0.2
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  http: ^1.2.0
  workmanager: ^0.9.0+3
  syncfusion_flutter_pdf: ^28.1.33
  flutter_dotenv: ^6.0.1
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/welcome/
    - assets/avatars/
    - assets/roadmap/
    - assets/badges/humanites/
    - assets/badges/langue/
    - assets/badges/litterature/
    - assets/badges/sciences/
    - assets/audio/
    - assets/icons/
    - assets/icons/badges_niveau/
